locales:
  es:
    title: Tip Calculator
    summary: Calculadora de propina para el reto de Frontend Mentor que reparte la cuenta por persona y ajusta el resultado según el porcentaje y el número de personas.
    role: Desarrollo individual con HTML5, SCSS y JavaScript Vanilla, incluyendo la lógica de cálculo, los estados del botón de reinicio y la estructura responsive.
    result: Cálculo de propina por porcentaje y número de personas, botón de reinicio bloqueado cuando no hay propina y una interfaz adaptable a móvil y escritorio.
    gallery: []
    narrative:
      problem: |
        El reto de Frontend Mentor pedía una calculadora que repartiera la propina y el total por persona según el porcentaje y el número de personas. La interfaz debía adaptarse a distintos tamaños de pantalla y mantener el botón de reinicio bloqueado cuando no hubiera una propina que calcular.
      role: |
        Desarrollo individual del reto con HTML5, SCSS y JavaScript Vanilla. Implementé la lógica de cálculo, el estado del botón de reinicio y la adaptación responsive.
      decisions:
        - "**Lógica de cálculo con JavaScript Vanilla.** Los eventListeners leen el porcentaje, el importe y el número de personas, y actualizan la propina y el total por persona sin depender de un framework."
        - "**Reinicio condicionado.** El botón se habilita o deshabilita combinando JavaScript y CSS, de modo que permanece bloqueado mientras no haya una propina que calcular."
        - "**Estructura HTML y estilos SCSS.** Definí primero la estructura del HTML con una herramienta de layout y después resolví la presentación y la adaptación responsive con SCSS."
      result: |
        La calculadora obtiene la propina según el porcentaje y el número de personas, mantiene el reinicio bloqueado cuando no corresponde y se adapta a móvil y escritorio. La solución está publicada en Netlify y su código está disponible en GitHub.
  en:
    title: Tip Calculator
    summary: Frontend Mentor tip calculator that splits the bill per person and updates the result from the selected percentage and number of people.
    role: Individual development with HTML5, SCSS, and vanilla JavaScript, covering the calculation logic, reset-button states, and responsive structure.
    result: Tip calculation by percentage and number of people, a reset button disabled when there is no tip to calculate, and an interface that adapts to mobile and desktop.
    gallery: []
    narrative:
      problem: |
        The Frontend Mentor challenge asked for a calculator that splits the tip and total per person according to the percentage and the number of people. The interface had to adapt to different screen sizes and keep the reset button disabled when there was no tip to calculate.
      role: |
        Individual development of the challenge with HTML5, SCSS, and vanilla JavaScript. I implemented the calculation logic, the reset-button state, and the responsive layout.
      decisions:
        - "**Calculation logic with vanilla JavaScript.** Event listeners read the percentage, bill amount, and number of people, then update the tip and per-person total without relying on a framework."
        - "**Conditional reset.** The button is enabled or disabled by combining JavaScript and CSS, so it stays blocked while there is no tip to calculate."
        - "**HTML structure and SCSS styling.** I first defined the HTML structure with a layout tool and then handled presentation and responsive adaptation with SCSS."
      result: |
        The calculator derives the tip from the percentage and the number of people, keeps reset disabled when it does not apply, and adapts to mobile and desktop. The solution is published on Netlify and its code is available on GitHub.
