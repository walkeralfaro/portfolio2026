locales:
  es:
    title: URL Shortener
    summary: Acortador de enlaces con backend propio, persistencia en MongoDB y validación compartida con Zod.
    role: Desarrollo individual para el reto de Frontend Mentor, incluyendo frontend, backend y persistencia.
    result: Backend que resuelve códigos en rutas /r/:code, lista de enlaces que se conserva al refrescar, copia al portapapeles y validación con Zod en cliente y servidor.
    gallery: []
    narrative:
      problem: |
        El reto de Frontend Mentor sugería resolver el acortado con una API externa. Para conservar el control del flujo, el proyecto necesitaba un backend propio que acortara enlaces, resolviera códigos y mantuviera la lista después de refrescar el navegador.
      role: |
        Desarrollo individual del reto: frontend, backend, persistencia y validación.
      decisions:
        - "**Backend propio en lugar de Clean URI.** Next.js asume el rol full-stack. Una petición GET a `/r/123abc` busca el código en la base de datos, recupera la URL original y valida que sea una dirección real con un esquema Zod."
        - "**Persistencia con MongoDB.** Mongoose y MongoDB Atlas guardan los enlaces para que la lista sobreviva al refresco, y la copia al portapapeles se resuelve en un solo clic."
        - "**Validación compartida.** Zod se usa en el frontend y en el backend para mantener la misma regla de entrada en toda la pila."
      result: |
        El acortador permite crear enlaces, conserva la lista tras refrescar y resuelve cada código corto mediante el backend propio. El formulario informa cuando el campo está vacío y la interfaz se adapta al tamaño de pantalla. La autenticación, la analítica, las URLs de marca y el seguimiento UTM quedan documentados como trabajo futuro, no como funcionalidad entregada.
  en:
    title: URL Shortener
    summary: Link shortener with its own backend, MongoDB persistence, and shared Zod validation.
    role: Individual development for the Frontend Mentor challenge, including frontend, backend, and persistence.
    result: A backend that resolves codes at /r/:code, a link list that survives refreshes, clipboard copying, and Zod validation on both client and server.
    gallery: []
    narrative:
      problem: |
        The Frontend Mentor challenge suggested handling shortening through an external API. To keep control of the flow, the project needed its own backend that could shorten links, resolve codes, and keep the list after a browser refresh.
      role: |
        Individual development of the challenge: frontend, backend, persistence, and validation.
      decisions:
        - "**A custom backend instead of Clean URI.** Next.js takes the full-stack role. A GET request to `/r/123abc` looks up the code in the database, retrieves the original URL, and validates it as a real address with a Zod schema."
        - "**Persistence with MongoDB.** Mongoose and MongoDB Atlas store the links so the list survives a refresh, while clipboard copying is handled in a single click."
        - "**Shared validation.** Zod is used on the frontend and backend to keep the same input rule across the stack."
      result: |
        The shortener creates links, keeps the list after a refresh, and resolves each short code through its own backend. The form reports an empty field, and the interface adapts to the screen size. Authentication, analytics, branded URLs, and UTM tracking are documented as future work, not as delivered features.
