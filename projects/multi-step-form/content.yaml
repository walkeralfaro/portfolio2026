locales:
  es:
    title: Multi-step Form
    summary: Formulario por pasos con validación, resumen de selecciones y confirmación final.
    role: Desarrollo individual para el reto de Frontend Mentor, incluyendo el flujo por pasos, la validación y los estilos.
    result: Flujo que permite volver a pasos anteriores, resumen y confirmación de la orden, validación de campos y correo, y diseño responsive.
    gallery: []
    narrative:
      problem: |
        Un formulario de pedido dividido en pasos debe conservar las selecciones, permitir volver atrás, validar cada campo y mostrar un resumen comprensible antes de confirmar. La interfaz también tiene que responder a móvil y escritorio y mantener estados de foco visibles.
      role: |
        Desarrollo individual del reto de Frontend Mentor: flujo por pasos, validación y estilos.
      decisions:
        - "**Estado compartido con React Hook Form.** El contexto global de la librería permite que los pasos y el resumen lean la misma selección sin duplicar el estado."
        - "**Sistema visual con Shadcn y Tailwind.** Los componentes y las variables CSS mantienen una tipografía y un lenguaje visual consistentes, incluida la fuente personalizada."
        - "**Validación con mensajes específicos.** El flujo informa cuando falta un campo, cuando el correo no tiene formato válido y cuando se intenta avanzar sin elegir una opción."
      result: |
        El formulario permite completar la secuencia, regresar a un paso anterior, revisar un resumen y confirmar la orden. La validación cubre campos vacíos, formato de correo y selecciones ausentes, y el diseño se resuelve con un enfoque mobile-first y estados de hover y foco.
  en:
    title: Multi-step Form
    summary: Multi-step form with validation, a selection summary, and final confirmation.
    role: Individual development for the Frontend Mentor challenge, covering the step flow, validation, and styling.
    result: A flow that allows returning to previous steps, an order summary and confirmation, field and email validation, and a responsive layout.
    gallery: []
    narrative:
      problem: |
        An order form split into steps must preserve selections, allow returning to an earlier step, validate each field, and show a clear summary before confirmation. The interface also has to respond to mobile and desktop layouts and keep focus states visible.
      role: |
        Individual development for the Frontend Mentor challenge: step flow, validation, and styling.
      decisions:
        - "**Shared state with React Hook Form.** The library's global context lets the steps and summary read the same selection without duplicating state."
        - "**A visual system with Shadcn and Tailwind.** Components and CSS variables keep typography and visual language consistent, including the custom font."
        - "**Validation with specific messages.** The flow reports a missing field, an invalid email format, and an attempt to continue without selecting an option."
      result: |
        The form lets the user complete the sequence, return to a previous step, review a summary, and confirm the order. Validation covers empty fields, email format, and missing selections, while the layout uses a mobile-first workflow with hover and focus states.
